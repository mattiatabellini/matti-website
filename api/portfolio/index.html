<!DOCTYPE html>
<html>
<head>
  <title>Portfolio</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <h1>IBKR Portfolio</h1>
  <div id="data">Loading...</div>
  <script>
    fetch('/api/ibkr-portfolio')
      .then(r => r.json())
      .then(d => document.getElementById('data').innerHTML = JSON.stringify(d, null, 2))
      .catch(e => document.getElementById('data').innerHTML = 'Error: ' + e.message);
  </script>
</body>
</html>
